name: Runtime image diagnostics
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - name: Build Frappe runtime image
        run: >-
          docker build
          --build-arg WITH_ERPNEXT=0
          --tag noxus-runtime:diagnostic
          --file infrastructure/docker/images/backend.Dockerfile
          .
      - name: Record detailed Trivy report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: noxus-runtime:diagnostic
          format: json
          output: trivy-runtime.json
          exit-code: "0"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-runtime-diagnostic
          path: trivy-runtime.json
          if-no-files-found: error
          retention-days: 3
