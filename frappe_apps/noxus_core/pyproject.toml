[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "noxus_core"
version = "1.0.0"
description = "NOXUS module registry and solution control plane"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-or-later"
dependencies = ["pydantic==2.12.5", "packaging==26.2", "PyYAML==6.0.3"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["noxus_core*"]
