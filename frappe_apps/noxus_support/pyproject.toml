name = "noxus_support"
version = "1.0.0rc1"
description = "Small functional NOXUS support app"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-or-later"
[tool.setuptools.packages.find]
include = ["noxus_support*"]
