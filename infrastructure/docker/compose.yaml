name: ${COMPOSE_PROJECT_NAME:-noxus}

x-backend: &backend
  image: noxus-runtime:${NOXUS_VERSION:-1.0.0rc1}
  build:
    context: ../..
    dockerfile: infrastructure/docker/images/backend.Dockerfile
    args:
      FRAPPE_COMMIT: be4728af84ecdec9e3e555f0aca1a7766d3f1811
      ERPNEXT_COMMIT: a5de60c357d531cb31da093f0b86301776965173
      WITH_ERPNEXT: ${NOXUS_WITH_ERPNEXT:-0}
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  networks: [noxus]
  depends_on:
    configurator: {condition: service_completed_successfully}
    site-creator: {condition: service_completed_successfully}

services:
  mariadb:
    image: mariadb:11.8.6@sha256:78a5047d3ba33975f183f183c2464cc7f1eab13ec8667e57cc9a5821d6da7577
    profiles: [development, production]
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
    secrets: [mariadb_root_password]
    volumes: [mariadb:/var/lib/mysql]
    networks: [noxus]
    healthcheck:
      test: [CMD-SHELL, "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis-cache:
    image: redis:7.2.14-bookworm@sha256:f0707c78ea880b293ccdeb410c9c0a8ccae93fe7128799b751333a698b0a39a7
    profiles: [development, production]
    restart: unless-stopped
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory-policy, allkeys-lru]
    networks: [noxus]
    healthcheck: &redis-health
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-queue:
    image: redis:7.2.14-bookworm@sha256:f0707c78ea880b293ccdeb410c9c0a8ccae93fe7128799b751333a698b0a39a7
    profiles: [development, production]
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-queue:/data]
    networks: [noxus]
    healthcheck: *redis-health

  redis-socketio:
    image: redis:7.2.14-bookworm@sha256:f0707c78ea880b293ccdeb410c9c0a8ccae93fe7128799b751333a698b0a39a7
    profiles: [development, production]
    restart: unless-stopped
    command: [redis-server, --save, "", --appendonly, "no"]
    networks: [noxus]
    healthcheck: *redis-health

  configurator:
    <<: *backend
    profiles: [development, production]
    restart: "no"
    depends_on:
      mariadb: {condition: service_healthy}
      redis-cache: {condition: service_healthy}
      redis-queue: {condition: service_healthy}
      redis-socketio: {condition: service_healthy}
    command: [bash, /opt/noxus/scripts/configure.sh]

  site-creator:
    <<: *backend
    profiles: [development, production]
    restart: "no"
    user: "0:0"
    depends_on:
      configurator: {condition: service_completed_successfully}
    environment:
      NOXUS_SITE: ${NOXUS_SITE:-noxus.localhost}
      NOXUS_APPS: ${NOXUS_APPS:-noxus_core}
      NOXUS_WITH_ERPNEXT: ${NOXUS_WITH_ERPNEXT:-0}
      NOXUS_ADMIN_PASSWORD: ${NOXUS_ADMIN_PASSWORD:-}
      NOXUS_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
    secrets: [admin_password, mariadb_root_password]
    command: [bash, /opt/noxus/scripts/create-site-entrypoint.sh]

  backend:
    <<: *backend
    profiles: [development, production]
    command: [bench, serve, --port, "8000"]
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8000/api/method/ping]
      interval: 10s
      timeout: 5s
      retries: 30

  worker-short:
    <<: *backend
    profiles: [development, production]
    command: [bench, worker, --queue, short,default]

  worker-long:
    <<: *backend
    profiles: [development, production]
    command: [bench, worker, --queue, long,default]

  scheduler:
    <<: *backend
    profiles: [development, production]
    command: [bench, schedule]

  websocket:
    <<: *backend
    profiles: [development, production]
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]

  proxy:
    image: noxus-proxy:${NOXUS_VERSION:-1.0.0rc1}
    build:
      context: ../..
      dockerfile: infrastructure/docker/images/proxy.Dockerfile
    profiles: [development, production]
    restart: unless-stopped
    environment:
      NOXUS_SITE: ${NOXUS_SITE:-noxus.localhost}
    ports: ["${NOXUS_HTTP_PORT:-8080}:8080"]
    networks: [noxus]
    depends_on:
      backend: {condition: service_healthy}
      websocket: {condition: service_started}
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://localhost:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 20

secrets:
  admin_password:
    file: ${NOXUS_ADMIN_PASSWORD_FILE:-./secrets/admin_password.txt}
  mariadb_root_password:
    file: ./secrets/mariadb_root_password.txt

volumes:
  mariadb:
  redis-queue:
  sites:
  logs:
  backups:

networks:
  noxus:
    internal: false
